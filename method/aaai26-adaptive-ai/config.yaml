# Adaptive AI -- AAAI 2026 Configuration

paths:
  data: # /path/to/woofnette/data
  models: # /path/to/models
  woofnette_images: # /path/to/woofnette/test/images
  pilot_cm: data/woofnette_pilot_cm.csv

classes:
  - church
  - garbage truck
  - gas pump
  - golf ball
  - parachute
  - Rhodesian ridgeback
  - Australian terrier
  - Border terrier
  - Old English sheepdog
  - Dingo

# Classes 0-4 are objects (easy), 5-9 are dog breeds (hard)
objects: [church, garbage truck, gas pump, golf ball, parachute]
dogs: [Rhodesian ridgeback, Australian terrier, Border terrier, Old English sheepdog, Dingo]

# Human accuracy per class (from pilot study)
human_accuracy:
  church: 0.87
  garbage truck: 0.84
  gas pump: 0.81
  golf ball: 0.90
  parachute: 0.86
  Rhodesian ridgeback: 0.51
  Australian terrier: 0.27
  Border terrier: 0.41
  Old English sheepdog: 0.56
  Dingo: 0.52

# College Admission experiment defaults
college_admission:
  n_instances: 10000
  delta: 0.25
  tau: 0.5
  test_size: 0.3
  random_state: 42

# WoofNette experiment defaults
woofnette:
  image_size: [128, 128, 3]
  num_classes: 10
  batch_size: 512
  max_epochs: 1000
  acc_threshold: 0.60
  backbone: resnet50
  confidence_predictor:
    backbone: resnet152
    model_path: # /path/to/m_agr_resnet152.keras
    model_type: agreement
    epochs: 500
  simulation:
    seeds: [337, 485, 619, 839, 879]
    threshold_low: 0.6
    threshold_high: 0.8
    team_model: online
    conf_range: 0.05
